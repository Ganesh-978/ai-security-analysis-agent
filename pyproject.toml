[project]
name = "ai-security-analysis-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ganesh-978", email = "ganeshsairam999@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.5.5",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115.0",
    "langchain>=0.3.0",
    "langchain-chroma>=0.1.4",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.28",
    "markdown>=3.7",
    "pydantic>=2.9.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "requests>=2.32.3",
    "sentence-transformers>=3.0.1",
    "streamlit>=1.39.0",
    "unstructured>=0.15.0",
    "uvicorn>=0.31.0",
]

[project.scripts]
ai-security-analysis-agent = "ai_security_analysis_agent:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
